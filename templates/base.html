<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}レシピ検索アプリ{% endblock %}</title>
    
    <!-- キャッシュ防止 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex, nofollow, nocache">
    
    <!-- PWA設定 -->
    <meta name="theme-color" content="#007bff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="レシピ検索">
    
    <link rel="manifest" href="{{ url_for('pwa_app.manifest') }}">
    <link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='icon-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192x192.png') }}">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- ▼▼▼▼▼追加▼▼▼▼▼ -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}?v=11">
    <!-- ▲▲▲▲▲追加▲▲▲▲▲ -->

</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="app-header">
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <img src="{{ url_for('static', filename='icon-192x192.png') }}" alt="Fridgee" class="header-logo">
            <h1>{% block page_title %}レシピ検索アプリ{% endblock %}</h1>
        </div>
        <a href="{{ url_for('loginout_app.logout') }}" class="btn btn-outline-light btn-sm">
            ログアウト
        </a>
    </div>
</div>

        <!-- フラッシュメッセージ -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info alert-dismissible" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- メインコンテンツ -->
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

   <!-- 下部ナビゲーション -->
<nav class="bottom-nav">

        </div>

    <!-- ここからJavaScript -->
    <script>
        // PWA Service Worker登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(function(registration) {
                    console.log('✅ Service Worker registered');
                })
            .catch(function(error) {
            console.log('❌ Service Worker registration failed:', error);
            });
        }
        
        // フォーム送信の重複防止
        document.addEventListener('submit', function(e) {
            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn) {
                submitBtn.disabled = true;
                setTimeout(function() {
                    submitBtn.disabled = false;
                }, 3000);
            }
        });
    </script>
    
    {% block extra_js %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
